[project]
name = "pairs-bt"
version = "0.1.0"
description = "ACKPT-50: Adaptive Cost-Aware Kalman Pairs Trading — event-driven walk-forward backtest (Binance USDⓈ-M)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "polars>=1.10",
    "pyarrow>=17",
    "scipy>=1.14",
    "statsmodels>=0.14.4",
    "networkx>=3.3",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "structlog>=24.4",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "typer>=0.12",
]

[project.optional-dependencies]
perf = ["numba>=0.60"]
notebook = ["jupyterlab>=4.2", "ipykernel>=6.29"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "pre-commit>=4.0",
]

[project.scripts]
pairs-bt = "pairs_bt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pairs_bt"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks", "artifacts", "old"]  # "data" deseni src/pairs_bt/data paketini de dışlıyordu

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PT", "RUF", "NPY", "PD", "DTZ", "T20"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Türkçe karakterler serbest

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"scripts/**" = ["T20"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["pairs_bt"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["statsmodels.*", "scipy.*", "networkx.*", "numba.*", "pyarrow.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network'"
markers = [
    "slow: uzun süren testler (deselect: -m 'not slow')",
    "network: ağ erişimi gerektirir (varsayılan olarak çalışmaz)",
    "regression: golden artifact karşılaştırmaları",
]
filterwarnings = ["error::FutureWarning"]

[tool.coverage.run]
source = ["src/pairs_bt"]
branch = true
